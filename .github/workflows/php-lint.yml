name: PHP Lint

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  php-lint:
    name: PHP syntax check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none

      - name: Lint PHP files
        run: |
          find . \
            -path './.git' -prune -o \
            -name '*.php' -print0 \
            | xargs -0 -n1 php -l
